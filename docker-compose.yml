services:
  # 1. POSTGRESQL 16 (5 CSDL ĐỘC LẬP TỰ ĐỘNG KHỞI TẠO)
  postgres:
    image: postgres:16-alpine
    container_name: tablemaster_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_MULTIPLE_DATABASES: tablemaster_auth,tablemaster_restaurant,tablemaster_booking,tablemaster_payment,tablemaster_analytics
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/db-init:/docker-entrypoint-initdb.d
    networks:
      - tablemaster-network

  # 2. REDIS CLUSTER 7.2 (IN-MEMORY CACHE, REDLOCK & BLACKLIST)
  redis:
    image: redis:7.2-alpine
    container_name: tablemaster_redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - tablemaster-network

  # 3. APACHE KAFKA (OFFICIAL APACHE IMAGE - KRAFT MODE)
  kafka:
    image: apache/kafka:latest
    container_name: tablemaster_kafka
    restart: always
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafkadata:/var/lib/kafka/data
    networks:
      - tablemaster-network

networks:
  tablemaster-network:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  kafkadata:
